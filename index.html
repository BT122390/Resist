<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ledger</title>
<style>

  :root{
    --bg:#FFFFFF; --bar:#EEF2F6; --text:#1F1F1F; --muted:#5F6368; --faint:#C4C7CC; --hair:#EEEEEE;
    --red:#D93025; --blue:#1A73E8; --green:#188038; --green-soft:#E6F4EA; --red-soft:#FCE8E6; --blue-soft:#E8F0FE;
    --pill:#FFFFFF; --sel:#D93025;
  }
  [data-theme="dark"]{
    --bg:#121212; --bar:#1F1F1F; --text:#E8EAED; --muted:#9AA0A6; --faint:#5F6368; --hair:#2A2A2A;
    --red:#F28B82; --blue:#8AB4F8; --green:#81C995; --green-soft:#1E3A2A; --red-soft:#3C2320; --blue-soft:#1E2D44;
    --pill:#2A2A2A; --sel:#F28B82;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Google Sans",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.4;color:var(--text);background:#000;-webkit-font-smoothing:antialiased}
  .phone{background:var(--bg);color:var(--text);width:100%;max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
  @media (min-width:600px){ body{padding:24px 0} .phone{height:calc(100dvh - 48px);border-radius:44px;border:1px solid #333} }

  /* top day bar (in the search-bar slot) */
  .top{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
  .daybar{background:var(--bar);border-radius:28px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center}
  .dbtn{width:42px;height:42px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .dbtn span{font-size:9px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
  .dbtn b{font-size:16px;font-weight:500;margin-top:2px}
  .dbtn.on{background:var(--sel);color:#fff}
  .dbtn.on span{color:#fff;opacity:.85}
  .dbtn .d{width:4px;height:4px;border-radius:50%;background:var(--green);margin-top:2px}
  .dbtn.on .d{background:#fff}
  .ctx{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 6px}
  .ctx .date{font-size:20px;font-weight:500}
  .ctx .race{font-size:13px;color:var(--red);font-weight:500}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
  .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 16px 6px}

  /* gmail-style rows */
  .row{display:flex;gap:14px;padding:11px 16px 11px 14px;align-items:flex-start;min-height:72px}
  .row + .row{border-top:1px solid var(--hair)}
  .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:600;margin-top:2px}
  .av svg{width:18px;height:18px;display:none}
  .done .av{background:var(--green)!important}
  .done .av svg{display:block}
  .done .av i{display:none}
  .av i{font-style:normal}
  .c1{background:#7B61FF}.c2{background:#E8710A}.c3{background:#1A73E8}.c4{background:#0B8043}.c5{background:#C5221F}.c6{background:#5F6368}
  .body{flex:1;min-width:0}
  .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .t .name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .done .t .name{font-weight:500;color:var(--muted)}
  .t .when{font-size:12px;color:var(--muted);flex:none}
  .done .t .when{color:var(--green);font-weight:600}
  .p1{font-size:15px;color:var(--text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p2 .star{color:#F4B400;margin-right:3px}
  .row.open .p1,.row.open .p2{white-space:normal}
  .exp{display:none;padding:0 16px 14px 68px;border-top:0}
  .row.open + .exp{display:block}
  .exp .field{display:flex;align-items:center;gap:10px;background:var(--bar);border-radius:24px;padding:8px 8px 8px 16px;font-size:16px;min-height:48px;margin-top:4px}
  .exp .field span{flex:1;color:var(--faint)}
  .exp .save{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
  .exp .save svg{width:15px;height:15px}
  .exp .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
  .exp p{font-size:15px}
  .exp .h{display:flex;gap:12px;font-size:15px;padding:4px 0}
  .exp .h span:first-child{color:var(--muted);width:56px;flex:none;font-size:13px;padding-top:2px}

  /* notes row */
  .row.note .av{background:var(--bar);color:var(--muted)}





  .ready{display:flex;align-items:center;gap:10px;padding:2px 16px 8px}
  .ready .rl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .rc{width:22px;height:22px;border-radius:50%;border:2px solid transparent;opacity:.45}
  .rc.g{background:var(--green)}.rc.y{background:#F9AB00}.rc.r{background:var(--red)}
  .rc.on{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
  .rc.g.on{color:var(--green)}.rc.y.on{color:#F9AB00}.rc.r.on{color:var(--red)}
  .ready .rt{font-size:13px;color:var(--muted);margin-left:2px}
  /* undo toast */
  .toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:#323232;color:#fff;border-radius:8px;padding:12px 16px;font-size:15px;display:none;justify-content:space-between;align-items:center;z-index:15;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .toast.on{display:flex}
  .toast b{color:#8AB4F8;font-weight:600}
  /* pain / rpe chips */
  .pr{display:flex;gap:14px;margin:10px 0 4px;flex-wrap:wrap}
  .pr .grp{display:flex;align-items:center;gap:6px}
  .pr .grp small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-right:2px}
  .pr .ch{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;font-size:13px;font-weight:500}
  .pr .ch.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .pr .ch.on.amber{background:#F9AB00;border-color:#F9AB00}


  .rdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .rdot.g{background:var(--green)}.rdot.y{background:#F9AB00}.rdot.r{background:var(--red)}
  #list .row.note{border-top:0;margin-top:0;border-bottom:1px solid var(--hair);background:var(--bar)}
  .nl{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair)}
  .nl span{color:var(--muted);font-size:13px;width:60px;flex:none;padding-top:2px;font-weight:600}
  .nl p{font-size:16px;line-height:1.45}
  #np .ready{padding:0 0 4px}

  /* swipe + drag */
  .sw{position:relative;overflow:hidden;border-top:1px solid var(--hair)}
  .sw:first-child{border-top:0}
  .sw .row{background:var(--bg);position:relative;transition:transform .18s;touch-action:pan-y}
  .sw .del{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--red);color:#fff;font-weight:600;display:grid;place-items:center;font-size:15px}
  .row + .row{border-top:0}
  .hdl{width:28px;align-self:stretch;display:grid;place-items:center;color:var(--faint);flex:none;margin:-11px -6px -11px 0;touch-action:none;cursor:grab}
  .hdl svg{width:18px;height:18px;fill:currentColor}
  .sw.lift .row{box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
  .sw.gap-top{border-top:2px solid var(--blue)}
  .sw.gap-bot{border-bottom:2px solid var(--blue)}
  #list{padding-top:2px}
  #list .row.note{border-top:1px solid var(--hair);margin-top:6px}
  /* add sheet */
  .shade{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20}
  .sheet{display:none;position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);z-index:21;max-height:78%;overflow-y:auto}
  .open-add .shade,.open-add .sheet{display:block}
  .grab{width:38px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 12px}
  .shead{font-size:18px;font-weight:600;margin-bottom:10px}
  .opt{display:flex;align-items:center;gap:14px;padding:11px 4px;border-top:1px solid var(--hair)}
  .opt .av{margin:0;width:36px;height:36px;font-size:15px}
  .opt .ob{flex:1;min-width:0}
  .opt b{display:block;font-size:16px;font-weight:600}
  .opt small{display:block;font-size:13px;color:var(--muted)}
  .opt .plus{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:20px}
  .opt.new .av{background:var(--bar);color:var(--muted)}
  .scope{display:flex;background:var(--bar);border-radius:12px;padding:3px;margin-top:14px}
  .scope span{flex:1;text-align:center;font-size:14px;font-weight:500;padding:8px 0;border-radius:9px;color:var(--muted)}
  .scope span.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* search */
  .sbar{padding:4px 6px 4px 4px;gap:6px}
  .sbar .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text)}
  .sbar .back svg{width:22px;height:22px}
  .sin{flex:1;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);outline:none;min-width:0}
  .clr{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:22px;flex:none}
  .weeks{display:flex;gap:8px;padding:10px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:none;font-size:13px;font-weight:500;border:1px solid var(--hair);border-radius:16px;padding:6px 12px;color:var(--text)}
  .wk.on{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue)}
  .smode{display:none}.smode.on{display:block}
  .jday{font-size:13px;font-weight:600;color:var(--muted);padding:16px 16px 4px;letter-spacing:.02em}
  #sp .row{min-height:64px}
  #sp .pgscroll{padding:0 0 calc(env(safe-area-inset-bottom) + 24px)}

  /* exercise page */
  .pg{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;transform:translateX(100%);transition:transform .22s ease-out}
  .pg.on{display:flex;transform:translateX(0)}
  .pgtop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
  .pgtop .back,.pgtop .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
  .pgtop .back svg,.pgtop .ic svg{width:24px;height:24px}
  .pgtop .pos{font-size:14px;color:var(--muted);font-weight:500}
  .pgacts{display:flex}
  .pgscroll{flex:1;overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 100px)}
  .pghead{display:flex;gap:14px;align-items:center;padding:8px 0 16px}
  .pgname{font-size:22px;font-weight:600;line-height:1.2}
  .pgsub{font-size:14px;color:var(--muted);margin-top:2px}
  .pgfield{display:flex;align-items:center;gap:10px;background:var(--bar);border-radius:26px;padding:8px 8px 8px 18px;font-size:17px;min-height:52px}
  .pgfield .ph{flex:1;color:var(--faint)}
  .pgfield .save{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
  .pgfield .save svg{width:16px;height:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
  .chips span{font-size:13px;font-weight:500;border:1px solid var(--hair);border-radius:16px;padding:6px 12px;color:var(--text);background:var(--bg)}
  .sec{padding:16px 0 4px;border-top:1px solid var(--hair);margin-top:12px}
  .sec .lab{padding:0 0 6px}
  .sec p{font-size:16px;line-height:1.5}
  .sec p + p{margin-top:8px}
  .sec .rule{color:var(--muted);font-size:15px}
  .sec .h{display:flex;gap:12px;font-size:16px;padding:7px 0;border-bottom:1px solid var(--hair)}
  .sec .h span:first-child{color:var(--muted);width:60px;flex:none;font-size:13px;padding-top:3px;font-weight:600}
  .sec .more{color:var(--blue);font-size:14px;font-weight:600;padding:12px 0 4px}
  .pgnav{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);display:flex;padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);gap:8px}
  .nb{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:14px;min-width:0}
  .nb.r{justify-content:flex-end;text-align:right}
  .nb svg{width:20px;height:20px;color:var(--muted);flex:none}
  .nb small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .nb b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nb div{min-width:0}

  /* bottom bar */
  .bot{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-between}
  .bb{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .bb .c{width:44px;height:44px;border-radius:50%;background:var(--bar);display:grid;place-items:center;color:var(--text);position:relative}
  .bb .c svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
  .bb .c.add{background:var(--blue);color:#fff}
  .bb .c .badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
  .bb small{font-size:10px;color:var(--muted)}

  /* ── app additions on top of the mockup stylesheet ── */
  input,textarea,button{font-family:inherit}
  .sin::placeholder,.pgfield input::placeholder,.exp .field input::placeholder{color:var(--faint)}
  .pgfield input,.exp .field input{flex:1;border:0;background:transparent;font:inherit;color:var(--text);outline:none;min-width:0}
  .dbtn{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .dbtn.sel{box-shadow:inset 0 0 0 2px var(--sel)}
  .dbtn.sel b{color:var(--sel)}
  .toast .undo{background:none;border:0;color:#8AB4F8;font-weight:600;font-size:15px;padding:4px 6px}
  .toast.err{background:var(--red);color:#fff}
  .toast.err .undo{color:#fff;text-decoration:underline}
  .boot{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--muted);font-size:15px}
  .setup{padding:44px 24px;color:var(--text)}
  .setup h1{font-size:26px;font-weight:600;margin-bottom:6px}
  .setup p{color:var(--muted);font-size:15px;margin-bottom:18px}
  .setup input{width:100%;background:var(--bar);border:0;border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;color:var(--text)}
  .setup button{margin-top:12px;width:100%;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:600;font-size:17px}
  .setup .err{color:var(--red);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ═══════════════════════ config ═══════════════════════ */

const BASE = 'appmqPkBzBzcKlrce';
const TBL = {
  exercises: 'tblQ39nQ8p8HRSsIC',
  schedule : 'tblZP0Fg1dKWJzII2',
  logs     : 'tblvJWkX10l1Fs6iE',
  races    : 'tblusBLP1tM1sR7DH',
  dayNotes : 'tblxTF4kmjHnGv4fx',
};

const LS_PAT    = 'ledger.pat';
const LS_THEME  = 'ledger.theme';
const LS_COLORS = 'ledger.blockColors';

const STALE_MS   = 60 * 60 * 1000;   // refetch Schedule on foreground after an hour
const SEARCH_MAX = 2000;             // stop the Logs sweep at 2000 rows …
const SEARCH_MONTHS = 12;            // … or 12 months back, whichever comes first

// Avatar palette from the mockup, used for Blocks in order of first appearance.
const AV_PALETTE = ['#7B61FF', '#E8710A', '#1A73E8', '#0B8043', '#C5221F', '#5F6368'];

// Sections have fixed colours; Recovery's teal is not in the mockup palette.
const SECTION_AV = {
  'Warm-Up':      { letter: 'W', color: '#5F6368' },
  'Main Session': { letter: 'M', color: '#0B8043' },
  'Finisher':     { letter: 'F', color: '#C5221F' },
  'Recovery':     { letter: 'R', color: '#00897B' },
};

/* ═══════════════════════ dates ═══════════════════════ */

const DOW  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const parseISO  = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso       = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayISO  = () => iso(new Date());
const addDays   = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const dowName   = s => DOW[parseISO(s).getDay()];
const weekStartOf = s => { const d = parseISO(s); const wd = d.getDay(); d.setDate(d.getDate() + (wd === 0 ? -6 : 1 - wd)); return iso(d); };
const weekDays  = s => { const m = weekStartOf(s); return Array.from({length:7}, (_,i) => addDays(m, i)); };
const nextMonday = s => addDays(weekStartOf(s), 7);

const fmtFull   = s => { const d = parseISO(s); return DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate(); };
const fmtShort  = s => { const d = parseISO(s); return MON3[d.getMonth()] + ' ' + d.getDate(); };
const fmtDayShort = s => { const d = parseISO(s); return DOW[d.getDay()] + ', ' + MON3[d.getMonth()] + ' ' + d.getDate(); };
const daysUntil = s => Math.round((parseISO(s) - parseISO(todayISO())) / 86400000);
const weekLabel = ws => {
  const end = addDays(ws, 6), a = parseISO(ws), b = parseISO(end);
  return a.getMonth() === b.getMonth()
    ? MON3[a.getMonth()] + ' ' + a.getDate() + '–' + b.getDate()
    : fmtShort(ws) + '–' + fmtShort(end);
};

/* ═══════════════════════ Airtable REST ═══════════════════════ */

class AuthError extends Error {}

let PAT = localStorage.getItem(LS_PAT) || '';
const setPat = v => { PAT = v; v ? localStorage.setItem(LS_PAT, v) : localStorage.removeItem(LS_PAT); };

const qs = pairs => pairs.map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
const esc = s => String(s).replace(/"/g, '\\"');

async function at(table, { method = 'GET', params = [], body } = {}) {
  const url = 'https://api.airtable.com/v0/' + BASE + '/' + table + (params.length ? '?' + qs(params) : '');
  const res = await fetch(url, {
    method,
    headers: { Authorization: 'Bearer ' + PAT, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 || res.status === 403) { setPat(''); throw new AuthError('Airtable rejected the token'); }
  if (!res.ok) throw new Error('Airtable ' + res.status + ': ' + (await res.text()).slice(0, 200));
  return res.status === 204 ? {} : res.json();
}

async function atAll(table, params = []) {
  const out = [];
  let offset;
  do {
    const j = await at(table, { params: offset ? params.concat([['offset', offset]]) : params });
    out.push(...j.records);
    offset = j.offset;
  } while (offset);
  return out;
}

async function atPage(table, params, offset) {
  const j = await at(table, { params: offset ? params.concat([['offset', offset]]) : params });
  return { records: j.records, offset: j.offset };
}

// Airtable caps writes at 10 records per request.
const chunk10 = arr => { const out = []; for (let i = 0; i < arr.length; i += 10) out.push(arr.slice(i, i+10)); return out; };

async function createMany(table, fieldsList) {
  const made = [];
  for (const batch of chunk10(fieldsList)) {
    const j = await at(table, { method: 'POST', body: { records: batch.map(fields => ({ fields })), typecast: false } });
    made.push(...j.records);
  }
  return made;
}
async function updateMany(table, records) {
  const done = [];
  for (const batch of chunk10(records)) {
    const j = await at(table, { method: 'PATCH', body: { records: batch } });
    done.push(...j.records);
  }
  return done;
}
async function deleteMany(table, ids) {
  for (const batch of chunk10(ids)) {
    await at(table, { method: 'DELETE', params: batch.map(id => ['records[]', id]) });
  }
}

/* ═══════════════════════ shaping ═══════════════════════ */

const shapeExercise = r => ({ id: r.id, name: r.fields['Name'] || '', notes: r.fields['Coaching Notes'] || '' });

const shapeRow = r => ({
  id: r.id,
  dow: r.fields['Day of Week'] || '',
  order: r.fields['Order'] == null ? 1e9 : r.fields['Order'],
  section: r.fields['Section'] || '',
  block: (r.fields['Block'] || '').trim(),
  weekOf: r.fields['Week Of'] || '',
  exercises: r.fields['Exercise'] || [],
  prescription: r.fields['Prescription'] || '',
});

// The write shape of a Schedule row, used for copy-on-write and Undo.
const rowFields = (r, weekOf) => {
  const f = {
    'Day of Week': r.dow,
    'Order': r.order,
    'Exercise': r.exercises,
  };
  if (weekOf !== undefined) { if (weekOf) f['Week Of'] = weekOf; }
  else if (r.weekOf) f['Week Of'] = r.weekOf;
  if (r.section) f['Section'] = r.section;
  if (r.block) f['Block'] = r.block;
  if (r.prescription) f['Prescription'] = r.prescription;
  return f;
};

const shapeLog  = r => ({ id: r.id, exerciseId: (r.fields['Exercise'] || [])[0] || '', date: r.fields['Log Date'] || '', text: r.fields['Log Text'] || '' });
const shapeRace = r => ({ id: r.id, name: r.fields['Name'] || '', date: r.fields['Date'] || '', status: r.fields['Status'] || '', place: r.fields['City/State'] || '', miles: r.fields['Miles'] || null });
const shapeNote = r => ({ id: r.id, date: r.fields['Date'] || '', notes: r.fields['Notes'] || '' });

/* ═══════════════════════ log text: pain / RPE ═══════════════════════ */

// Trailing " · pain N" and " · RPE N" are split off for display and search.
function splitResult(text) {
  let body = String(text || ''), pain = null, rpe = null, m;
  for (;;) {
    if ((m = body.match(/\s*·\s*RPE\s*(\d+)\s*$/i)))      { rpe  = +m[1]; body = body.slice(0, m.index); continue; }
    if ((m = body.match(/\s*·\s*pain\s*(\d+)\s*$/i)))     { pain = +m[1]; body = body.slice(0, m.index); continue; }
    break;
  }
  return { body: body.trim(), pain, rpe };
}
const joinResult = (body, pain, rpe) =>
  body.trim() + (pain == null ? '' : ' · pain ' + pain) + (rpe == null ? '' : ' · RPE ' + rpe);

const isSkipped = t => /^\s*skipped\b/i.test(String(t || ''));
const isCompleted = t => String(t || '').trim() === 'Completed';

/* ═══════════════════════ readiness ═══════════════════════ */

const READINESS = {
  Green:  { key: 'g', line: 'Green — execute as written' },
  Yellow: { key: 'y', line: 'Yellow — reduce intensity' },
  Red:    { key: 'r', line: 'Red — replace the session' },
};

// Readiness lives as a fixed first line of the day's Day Notes.
function splitNotes(raw) {
  const lines = String(raw || '').split('\n').map(s => s.trim()).filter(Boolean);
  let readiness = null;
  if (lines.length) {
    const m = lines[0].match(/^Readiness:\s*(Green|Yellow|Red)\s*$/i);
    if (m) {
      readiness = m[1][0].toUpperCase() + m[1].slice(1).toLowerCase();
      lines.shift();
    }
  }
  return { readiness, lines };
}
const buildNotes = (readiness, lines) =>
  (readiness ? ['Readiness: ' + readiness] : []).concat(lines).join('\n');

/* ═══════════════════════ avatars ═══════════════════════ */

// "Block A" → A, "Sled Superset" → S, "Accessory" → A.
const blockLetter = name => {
  const m = String(name).match(/^Block\s+(\S)/i);
  return (m ? m[1] : String(name).trim()[0] || '?').toUpperCase();
};

// Block colours are handed out in order of first appearance and kept in
// localStorage so a block keeps its colour between sessions.
const loadBlockColors = () => { try { return JSON.parse(localStorage.getItem(LS_COLORS)) || {}; } catch (e) { return {}; } };
let BLOCK_COLORS = loadBlockColors();

function blockColor(name) {
  if (BLOCK_COLORS[name]) return BLOCK_COLORS[name];
  const used = new Set(Object.values(BLOCK_COLORS));
  const free = AV_PALETTE.find(c => !used.has(c)) || AV_PALETTE[Object.keys(BLOCK_COLORS).length % AV_PALETTE.length];
  BLOCK_COLORS = { ...BLOCK_COLORS, [name]: free };
  try { localStorage.setItem(LS_COLORS, JSON.stringify(BLOCK_COLORS)); } catch (e) {}
  return free;
}

// Avatar comes from Block when the row has one, otherwise from Section.
function avatarFor(row) {
  if (row.block) return { letter: blockLetter(row.block), color: blockColor(row.block), label: row.block };
  const s = SECTION_AV[row.section];
  if (s) return { letter: s.letter, color: s.color, label: row.section };
  return { letter: (row.section || '?').trim()[0].toUpperCase(), color: '#5F6368', label: row.section };
}

const WEEKDAY_COLOR = {
  Monday: '#0B8043', Tuesday: '#E8710A', Wednesday: '#1A73E8', Thursday: '#7B61FF',
  Friday: '#C5221F', Saturday: '#00897B', Sunday: '#5F6368',
};
const dayAvatar = dow => ({ letter: (dow || '?')[0].toUpperCase(), color: WEEKDAY_COLOR[dow] || '#5F6368' });

/* ═══════════════════════ week resolution ═══════════════════════ */

// Rows whose Week Of matches the week's Monday are an overlay and replace the
// template entirely; otherwise the template rows (blank Week Of) are the week.
function weekRows(schedule, dateISO) {
  const ws = weekStartOf(dateISO);
  const overlay = schedule.filter(r => r.weekOf === ws);
  return { weekStart: ws, isOverlay: overlay.length > 0, rows: overlay.length ? overlay : schedule.filter(r => !r.weekOf) };
}

function rowsForDate(schedule, dateISO) {
  const { rows, isOverlay, weekStart } = weekRows(schedule, dateISO);
  const dow = dowName(dateISO);
  return { weekStart, isOverlay, rows: rows.filter(r => r.dow === dow).sort((a, b) => a.order - b.order) };
}

// One line per linked exercise; a row linking two exercises yields two lines.
function linesForDate(schedule, dateISO, exById) {
  const { rows, isOverlay, weekStart } = rowsForDate(schedule, dateISO);
  const lines = [];
  for (const r of rows) {
    for (const exId of r.exercises) {
      lines.push({
        key: r.id + ':' + exId,
        rowId: r.id,
        exerciseId: exId,
        name: (exById[exId] || {}).name || '(unknown exercise)',
        prescription: r.prescription,
        section: r.section,
        block: r.block,
        order: r.order,
        av: avatarFor(r),
      });
    }
  }
  return { weekStart, isOverlay, lines };
}

/* ═══════════════════════ copy-on-write materialization ═══════════════════════ */

// The first edit to a template week copies every template row for that week
// into Week Of = weekStart rows. Templates are never touched by this path.
async function materializeWeek(schedule, weekStart) {
  const already = schedule.filter(r => r.weekOf === weekStart);
  if (already.length) return { created: [], rows: already, wasNeeded: false };

  const template = schedule.filter(r => !r.weekOf);
  const made = await createMany(TBL.schedule, template.map(r => rowFields(r, weekStart)));
  return { created: made.map(shapeRow), rows: made.map(shapeRow), wasNeeded: true };
}

// Copy a week's resolved rows forward into another week's overlay.
async function copyWeekInto(schedule, fromDate, targetWeekStart) {
  const existing = schedule.filter(r => r.weekOf === targetWeekStart);
  if (existing.length) return { created: [], alreadyThere: true };
  const { rows } = weekRows(schedule, fromDate);
  const made = await createMany(TBL.schedule, rows.map(r => rowFields(r, targetWeekStart)));
  return { created: made.map(shapeRow), alreadyThere: false };
}

/* ═══════════════════════ console dump (step 1) ═══════════════════════ */

function dumpDay(label, dateISO, schedule, exById, logs) {
  const { lines, isOverlay, weekStart } = linesForDate(schedule, dateISO, exById);
  const done = new Set((logs || []).map(l => l.exerciseId));
  console.group('%c' + label + ' — ' + fmtFull(dateISO) + ' (' + dateISO + ')', 'font-weight:700;color:#D93025');
  console.log('week of ' + weekStart + ' · ' + (isOverlay ? 'OVERLAY rows (Week Of set)' : 'template rows (Week Of blank)') +
              ' · ' + lines.length + ' lines');
  console.table(lines.map(l => ({
    '✓': done.has(l.exerciseId) ? '✓' : '',
    av: l.av.letter,
    exercise: l.name,
    'block/section': l.block || l.section,
    order: l.order,
    prescription: l.prescription,
  })));
  console.groupEnd();
  return lines;
}

/* ═══════════════════════ boot (step 1: data layer only) ═══════════════════════ */

function Setup({ onDone }) {
  const [v, setV] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    const token = v.trim();
    if (!token) return;
    setBusy(true); setErr('');
    setPat(token);
    try { await at(TBL.exercises, { params: [['maxRecords', 1]] }); onDone(); }
    catch (e) {
      setPat('');
      setErr(e instanceof AuthError ? 'That token was rejected. Check its scopes and base access.' : String(e.message || e));
      setBusy(false);
    }
  };
  return (
    <div className="setup">
      <h1>Ledger</h1>
      <p>Paste an Airtable personal access token with <code>data.records:read</code> and <code>data.records:write</code> on the Training base. It is stored on this device only.</p>
      <input type="password" value={v} placeholder="pat…" autoCapitalize="off" autoCorrect="off" spellCheck="false"
             onChange={e => setV(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />
      <button onClick={submit} disabled={busy}>{busy ? 'Checking…' : 'Connect'}</button>
      {err && <div className="err">{err}</div>}
    </div>
  );
}

function App() {
  const [ready, setReady] = useState(!!PAT);
  const [data, setData] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    if (!ready) return;
    let live = true;
    (async () => {
      try {
        const [ex, sch, races] = await Promise.all([
          atAll(TBL.exercises), atAll(TBL.schedule), atAll(TBL.races),
        ]);
        const exercises = ex.map(shapeExercise);
        const exById = Object.fromEntries(exercises.map(e => [e.id, e]));
        const schedule = sch.map(shapeRow);

        const today = todayISO();
        const monday = nextMonday(today);
        const [todayLogs, todayNotes] = await Promise.all([
          atAll(TBL.logs, [['filterByFormula', '{Log Date} = "' + today + '"']]),
          atAll(TBL.dayNotes, [['filterByFormula', '{Date} = "' + today + '"']]),
        ]);
        if (!live) return;

        setData({ exercises, exById, schedule, races: races.map(shapeRace) });

        const overlays = [...new Set(schedule.map(r => r.weekOf).filter(Boolean))].sort();
        console.log('%cLedger v2 — data layer', 'font-size:14px;font-weight:700;color:#188038');
        console.log(exercises.length + ' exercises · ' + schedule.length + ' schedule rows (' +
                    schedule.filter(r => !r.weekOf).length + ' template, ' +
                    schedule.filter(r => r.weekOf).length + ' overlay) · ' + races.length + ' races');
        console.log('overlay weeks present: ' + (overlays.length ? overlays.join(', ') : 'none — every week resolves to the template'));

        const logs = todayLogs.map(shapeLog);
        dumpDay('TODAY', today, schedule, exById, logs);
        dumpDay('NEXT MONDAY', monday, schedule, exById, null);

        const { readiness, lines } = splitNotes((todayNotes[0] ? shapeNote(todayNotes[0]) : {}).notes);
        console.log('today: ' + logs.length + ' logs · day note ' + (todayNotes.length ? 'present' : 'none') +
                    ' · readiness ' + (readiness || 'unset') + ' · ' + lines.length + ' note lines');
        if (logs.length) {
          console.table(logs.map(l => {
            const s = splitResult(l.text);
            return { exercise: (exById[l.exerciseId] || {}).name || '?', result: s.body, pain: s.pain, RPE: s.rpe };
          }));
        }

        window.LEDGER = {
          exercises, exById, schedule, races: races.map(shapeRace),
          weekRows, rowsForDate, linesForDate, splitResult, splitNotes, avatarFor,
          day: d => dumpDay('Day', d, schedule, exById, null),
          // Write paths are wired but deliberately not called during step 1.
          materializeWeek: ws => materializeWeek(schedule, ws),
          copyWeekInto: (from, target) => copyWeekInto(schedule, from, target),
        };
        console.log('%cwindow.LEDGER.day("YYYY-MM-DD") resolves any other date.', 'color:#5F6368');
      } catch (e) {
        if (!live) return;
        if (e instanceof AuthError) { setReady(false); setError('Token rejected — enter it again.'); }
        else setError(String(e.message || e));
      }
    })();
    return () => { live = false; };
  }, [ready]);

  if (!ready) return <div className="phone"><Setup onDone={() => { setError(''); setReady(true); }} /></div>;

  return (
    <div className="phone">
      <div className="boot">
        {error ? <span style={{ color: 'var(--red)' }}>{error}</span>
               : data ? <span>Data layer loaded — open the console.<br />{data.exercises.length} exercises · {data.schedule.length} schedule rows</span>
                      : <span>Loading…</span>}
      </div>
    </div>
  );
}

const savedTheme = localStorage.getItem(LS_THEME);
document.documentElement.dataset.theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
