<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ledger</title>
<style>

  :root{
    --bg:#FFFFFF; --bar:#EEF2F6; --text:#1F1F1F; --muted:#5F6368; --faint:#C4C7CC; --hair:#EEEEEE;
    --red:#D93025; --blue:#1A73E8; --green:#188038; --green-soft:#E6F4EA; --red-soft:#FCE8E6; --blue-soft:#E8F0FE;
    --pill:#FFFFFF; --sel:#D93025;
  }
  [data-theme="dark"]{
    --bg:#121212; --bar:#1F1F1F; --text:#E8EAED; --muted:#9AA0A6; --faint:#5F6368; --hair:#2A2A2A;
    --red:#F28B82; --blue:#8AB4F8; --green:#81C995; --green-soft:#1E3A2A; --red-soft:#3C2320; --blue-soft:#1E2D44;
    --pill:#2A2A2A; --sel:#F28B82;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Google Sans",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.4;color:var(--text);background:#000;-webkit-font-smoothing:antialiased}
  .phone{background:var(--bg);color:var(--text);width:100%;max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
  @media (min-width:600px){ body{padding:24px 0} .phone{height:calc(100dvh - 48px);border-radius:44px;border:1px solid #333} }

  /* top day bar (in the search-bar slot) */
  .top{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
  .daybar{background:var(--bar);border-radius:28px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center}
  .dbtn{width:42px;height:42px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .dbtn span{font-size:9px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
  .dbtn b{font-size:16px;font-weight:500;margin-top:2px}
  .dbtn.on{background:var(--sel);color:#fff}
  .dbtn.on span{color:#fff;opacity:.85}
  .dbtn .d{width:4px;height:4px;border-radius:50%;background:var(--green);margin-top:2px}
  .dbtn.on .d{background:#fff}
  .ctx{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 6px}
  .ctx .date{font-size:20px;font-weight:500}
  .ctx .race{font-size:13px;color:var(--red);font-weight:500}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
  .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 16px 6px}

  /* gmail-style rows */
  .row{display:flex;gap:14px;padding:11px 16px 11px 14px;align-items:flex-start;min-height:72px}
  .row + .row{border-top:1px solid var(--hair)}
  .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:600;margin-top:2px}
  .av svg{width:18px;height:18px;display:none}
  .done .av{background:var(--green)!important}
  .done .av svg{display:block}
  .done .av i{display:none}
  .av i{font-style:normal}
  .c1{background:#7B61FF}.c2{background:#E8710A}.c3{background:#1A73E8}.c4{background:#0B8043}.c5{background:#C5221F}.c6{background:#5F6368}
  .body{flex:1;min-width:0}
  .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .t .name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .done .t .name{font-weight:500;color:var(--muted)}
  .t .when{font-size:12px;color:var(--muted);flex:none}
  .done .t .when{color:var(--green);font-weight:600}
  .p1{font-size:15px;color:var(--text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p2 .star{color:#F4B400;margin-right:3px}
  .row.open .p1,.row.open .p2{white-space:normal}
  .exp{display:none;padding:0 16px 14px 68px;border-top:0}
  .row.open + .exp{display:block}
  .exp .field{display:flex;align-items:center;gap:10px;background:var(--bar);border-radius:24px;padding:8px 8px 8px 16px;font-size:16px;min-height:48px;margin-top:4px}
  .exp .field span{flex:1;color:var(--faint)}
  .exp .save{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
  .exp .save svg{width:15px;height:15px}
  .exp .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
  .exp p{font-size:15px}
  .exp .h{display:flex;gap:12px;font-size:15px;padding:4px 0}
  .exp .h span:first-child{color:var(--muted);width:56px;flex:none;font-size:13px;padding-top:2px}

  /* notes row */
  .row.note .av{background:var(--bar);color:var(--muted)}





  .ready{display:flex;align-items:center;gap:10px;padding:2px 16px 8px}
  .ready .rl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .rc{width:22px;height:22px;border-radius:50%;border:2px solid transparent;opacity:.45}
  .rc.g{background:var(--green)}.rc.y{background:#F9AB00}.rc.r{background:var(--red)}
  .rc.on{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
  .rc.g.on{color:var(--green)}.rc.y.on{color:#F9AB00}.rc.r.on{color:var(--red)}
  .ready .rt{font-size:13px;color:var(--muted);margin-left:2px}
  /* undo toast */
  .toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);background:#323232;color:#fff;border-radius:8px;padding:12px 16px;font-size:15px;display:none;justify-content:space-between;align-items:center;z-index:15;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .toast.on{display:flex}
  .toast b{color:#8AB4F8;font-weight:600}
  /* pain / rpe chips */
  .pr{display:flex;gap:14px;margin:10px 0 4px;flex-wrap:wrap}
  .pr .grp{display:flex;align-items:center;gap:6px}
  .pr .grp small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-right:2px}
  .pr .ch{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;font-size:13px;font-weight:500}
  .pr .ch.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .pr .ch.on.amber{background:#F9AB00;border-color:#F9AB00}


  .rdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .rdot.g{background:var(--green)}.rdot.y{background:#F9AB00}.rdot.r{background:var(--red)}
  #list .row.note{border-top:0;margin-top:0;border-bottom:1px solid var(--hair);background:var(--bar)}
  .nl{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair)}
  .nl span{color:var(--muted);font-size:13px;width:60px;flex:none;padding-top:2px;font-weight:600}
  .nl p{font-size:16px;line-height:1.45}
  #np .ready{padding:0 0 4px}

  /* swipe + drag */
  .sw{position:relative;overflow:hidden;border-top:1px solid var(--hair)}
  .sw:first-child{border-top:0}
  .sw .row{background:var(--bg);position:relative;transition:transform .18s;touch-action:pan-y}
  .sw .del{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--red);color:#fff;font-weight:600;display:grid;place-items:center;font-size:15px}
  .row + .row{border-top:0}
  .hdl{width:28px;align-self:stretch;display:grid;place-items:center;color:var(--faint);flex:none;margin:-11px -6px -11px 0;touch-action:none;cursor:grab}
  .hdl svg{width:18px;height:18px;fill:currentColor}
  .sw.lift .row{box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
  .sw.gap-top{border-top:2px solid var(--blue)}
  .sw.gap-bot{border-bottom:2px solid var(--blue)}
  #list{padding-top:2px}
  #list .row.note{border-top:1px solid var(--hair);margin-top:6px}
  /* add sheet */
  .shade{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20}
  .sheet{display:none;position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);z-index:21;max-height:78%;overflow-y:auto}
  .open-add .shade,.open-add .sheet{display:block}
  .grab{width:38px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 12px}
  .shead{font-size:18px;font-weight:600;margin-bottom:10px}
  .opt{display:flex;align-items:center;gap:14px;padding:11px 4px;border-top:1px solid var(--hair)}
  .opt .av{margin:0;width:36px;height:36px;font-size:15px}
  .opt .ob{flex:1;min-width:0}
  .opt b{display:block;font-size:16px;font-weight:600}
  .opt small{display:block;font-size:13px;color:var(--muted)}
  .opt .plus{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:20px}
  .opt.new .av{background:var(--bar);color:var(--muted)}
  .scope{display:flex;background:var(--bar);border-radius:12px;padding:3px;margin-top:14px}
  .scope span{flex:1;text-align:center;font-size:14px;font-weight:500;padding:8px 0;border-radius:9px;color:var(--muted)}
  .scope span.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* search */
  .sbar{padding:4px 6px 4px 4px;gap:6px}
  .sbar .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text)}
  .sbar .back svg{width:22px;height:22px}
  .sin{flex:1;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);outline:none;min-width:0}
  .clr{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:22px;flex:none}
  .weeks{display:flex;gap:8px;padding:10px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:none;font-size:13px;font-weight:500;border:1px solid var(--hair);border-radius:16px;padding:6px 12px;color:var(--text)}
  .wk.on{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue)}
  .smode{display:none}.smode.on{display:block}
  .jday{font-size:13px;font-weight:600;color:var(--muted);padding:16px 16px 4px;letter-spacing:.02em}
  #sp .row{min-height:64px}
  #sp .pgscroll{padding:0 0 calc(env(safe-area-inset-bottom) + 24px)}

  /* exercise page */
  .pg{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;transform:translateX(100%);transition:transform .22s ease-out}
  .pg.on{display:flex;transform:translateX(0)}
  .pgtop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
  .pgtop .back,.pgtop .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
  .pgtop .back svg,.pgtop .ic svg{width:24px;height:24px}
  .pgtop .pos{font-size:14px;color:var(--muted);font-weight:500}
  .pgacts{display:flex}
  .pgscroll{flex:1;overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 100px)}
  .pghead{display:flex;gap:14px;align-items:center;padding:8px 0 16px}
  .pgname{font-size:22px;font-weight:600;line-height:1.2}
  .pgsub{font-size:14px;color:var(--muted);margin-top:2px}
  .pgfield{display:flex;align-items:center;gap:10px;background:var(--bar);border-radius:26px;padding:8px 8px 8px 18px;font-size:17px;min-height:52px}
  .pgfield .ph{flex:1;color:var(--faint)}
  .pgfield .save{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
  .pgfield .save svg{width:16px;height:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
  .chips span{font-size:13px;font-weight:500;border:1px solid var(--hair);border-radius:16px;padding:6px 12px;color:var(--text);background:var(--bg)}
  .sec{padding:16px 0 4px;border-top:1px solid var(--hair);margin-top:12px}
  .sec .lab{padding:0 0 6px}
  .sec p{font-size:16px;line-height:1.5}
  .sec p + p{margin-top:8px}
  .sec .rule{color:var(--muted);font-size:15px}
  .sec .h{display:flex;gap:12px;font-size:16px;padding:7px 0;border-bottom:1px solid var(--hair)}
  .sec .h span:first-child{color:var(--muted);width:60px;flex:none;font-size:13px;padding-top:3px;font-weight:600}
  .sec .more{color:var(--blue);font-size:14px;font-weight:600;padding:12px 0 4px}
  .pgnav{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);display:flex;padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);gap:8px}
  .nb{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:14px;min-width:0}
  .nb.r{justify-content:flex-end;text-align:right}
  .nb svg{width:20px;height:20px;color:var(--muted);flex:none}
  .nb small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .nb b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nb div{min-width:0}

  /* bottom bar */
  .bot{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-between}
  .bb{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .bb .c{width:44px;height:44px;border-radius:50%;background:var(--bar);display:grid;place-items:center;color:var(--text);position:relative}
  .bb .c svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
  .bb .c.add{background:var(--blue);color:#fff}
  .bb .c .badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
  .bb small{font-size:10px;color:var(--muted)}

  /* ── app additions on top of the mockup stylesheet ── */
  input,textarea,button{font-family:inherit}
  .sin::placeholder,.pgfield input::placeholder,.exp .field input::placeholder{color:var(--faint)}
  .pgfield input,.exp .field input{flex:1;border:0;background:transparent;font:inherit;color:var(--text);outline:none;min-width:0}
  .dbtn{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .dbtn.sel{box-shadow:inset 0 0 0 2px var(--sel)}
  .dbtn.sel b{color:var(--sel)}
  .toast .undo{background:none;border:0;color:#8AB4F8;font-weight:600;font-size:15px;padding:4px 6px}
  .toast.err{background:var(--red);color:#fff}
  .toast.err .undo{color:#fff;text-decoration:underline}
  .ctx{gap:10px}
  .ctx .date{flex:none;white-space:nowrap}
  .ctx .race{flex:1;min-width:0;justify-content:flex-end}
  .sw .del{z-index:0;visibility:hidden}
  .sw.swiping .del{visibility:visible}
  .sw .row{z-index:1}
  .ctx .race{display:flex;gap:4px;align-items:baseline}
  .ctx .race .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctx .race .rd{flex:none}
  .shade.show,.sheet.show{display:block}
  /* rows sit at z-index 1 so the Remove panel stays behind them, which means
     the slide-in pages need to clear that. */
  .pg{z-index:10}
  .pg .shade,.pg .sheet{z-index:30}
  .opt .ob b{font-size:16px}
  .chipmini{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--bar);color:var(--muted)}
  .chipmini[data-amber="amber"]{background:#FEF7E0;color:#B06000}
  .chipmini[data-amber="red"]{background:var(--red-soft);color:var(--red)}
  [data-theme="dark"] .chipmini[data-amber="amber"]{background:#3A2F14;color:#F9AB00}
  .boot{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--muted);font-size:15px}
  .setup{padding:44px 24px;color:var(--text)}
  .setup h1{font-size:26px;font-weight:600;margin-bottom:6px}
  .setup p{color:var(--muted);font-size:15px;margin-bottom:18px}
  .setup input{width:100%;background:var(--bar);border:0;border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;color:var(--text)}
  .setup button{margin-top:12px;width:100%;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:600;font-size:17px}
  .setup .err{color:var(--red);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ═══════════════════════ config ═══════════════════════ */

const BASE = 'appmqPkBzBzcKlrce';
const TBL = {
  exercises: 'tblQ39nQ8p8HRSsIC',
  schedule : 'tblZP0Fg1dKWJzII2',
  logs     : 'tblvJWkX10l1Fs6iE',
  races    : 'tblusBLP1tM1sR7DH',
  dayNotes : 'tblxTF4kmjHnGv4fx',
};

const LS_PAT    = 'ledger.pat';
const LS_THEME  = 'ledger.theme';
const LS_COLORS = 'ledger.blockColors';

const STALE_MS   = 60 * 60 * 1000;   // refetch Schedule on foreground after an hour
const SEARCH_MAX = 2000;             // stop the Logs sweep at 2000 rows …
const SEARCH_MONTHS = 12;            // … or 12 months back, whichever comes first

// Avatar palette from the mockup, used for Blocks in order of first appearance.
const AV_PALETTE = ['#7B61FF', '#E8710A', '#1A73E8', '#0B8043', '#C5221F', '#5F6368'];

// Sections have fixed colours; Recovery's teal is not in the mockup palette.
const SECTION_AV = {
  'Warm-Up':      { letter: 'W', color: '#5F6368' },
  'Main Session': { letter: 'M', color: '#0B8043' },
  'Finisher':     { letter: 'F', color: '#C5221F' },
  'Recovery':     { letter: 'R', color: '#00897B' },
};

/* ═══════════════════════ dates ═══════════════════════ */

const DOW  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const parseISO  = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso       = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayISO  = () => iso(new Date());
const addDays   = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const dowName   = s => DOW[parseISO(s).getDay()];
const weekStartOf = s => { const d = parseISO(s); const wd = d.getDay(); d.setDate(d.getDate() + (wd === 0 ? -6 : 1 - wd)); return iso(d); };
const weekDays  = s => { const m = weekStartOf(s); return Array.from({length:7}, (_,i) => addDays(m, i)); };
const nextMonday = s => addDays(weekStartOf(s), 7);

const fmtFull   = s => { const d = parseISO(s); return DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate(); };
const fmtShort  = s => { const d = parseISO(s); return MON3[d.getMonth()] + ' ' + d.getDate(); };
const fmtDayShort = s => { const d = parseISO(s); return DOW[d.getDay()] + ', ' + MON3[d.getMonth()] + ' ' + d.getDate(); };
const daysUntil = s => Math.round((parseISO(s) - parseISO(todayISO())) / 86400000);
const weekLabel = ws => {
  const end = addDays(ws, 6), a = parseISO(ws), b = parseISO(end);
  return a.getMonth() === b.getMonth()
    ? MON3[a.getMonth()] + ' ' + a.getDate() + '–' + b.getDate()
    : fmtShort(ws) + '–' + fmtShort(end);
};

/* ═══════════════════════ Airtable REST ═══════════════════════ */

class AuthError extends Error {}

let PAT = localStorage.getItem(LS_PAT) || '';
const setPat = v => { PAT = v; v ? localStorage.setItem(LS_PAT, v) : localStorage.removeItem(LS_PAT); };

const qs = pairs => pairs.map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
const esc = s => String(s).replace(/"/g, '\\"');

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function at(table, { method = 'GET', params = [], body } = {}) {
  const url = 'https://api.airtable.com/v0/' + BASE + '/' + table + (params.length ? '?' + qs(params) : '');
  for (let attempt = 0; ; attempt++) {
    const res = await fetch(url, {
      method,
      headers: { Authorization: 'Bearer ' + PAT, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401 || res.status === 403) { setPat(''); throw new AuthError('Airtable rejected the token'); }
    // 5 requests/sec per base; wait out the limit rather than surfacing it.
    if (res.status === 429 && attempt < 4) { await sleep(400 * (attempt + 1)); continue; }
    if (!res.ok) throw new Error('Airtable ' + res.status + ': ' + (await res.text()).slice(0, 200));
    return res.status === 204 ? {} : res.json();
  }
}

// Keeps the per-exercise "last result" fan-out under the rate limit.
function makeLimiter(n) {
  let active = 0; const queue = [];
  const next = () => { if (active >= n || !queue.length) return; active++; const { fn, res, rej } = queue.shift();
    fn().then(res, rej).finally(() => { active--; next(); }); };
  return fn => new Promise((res, rej) => { queue.push({ fn, res, rej }); next(); });
}
const limit = makeLimiter(3);

async function atAll(table, params = []) {
  const out = [];
  let offset;
  do {
    const j = await at(table, { params: offset ? params.concat([['offset', offset]]) : params });
    out.push(...j.records);
    offset = j.offset;
  } while (offset);
  return out;
}

async function atPage(table, params, offset) {
  const j = await at(table, { params: offset ? params.concat([['offset', offset]]) : params });
  return { records: j.records, offset: j.offset };
}

// Airtable caps writes at 10 records per request.
const chunk10 = arr => { const out = []; for (let i = 0; i < arr.length; i += 10) out.push(arr.slice(i, i+10)); return out; };

async function createMany(table, fieldsList) {
  const made = [];
  for (const batch of chunk10(fieldsList)) {
    const j = await at(table, { method: 'POST', body: { records: batch.map(fields => ({ fields })), typecast: false } });
    made.push(...j.records);
  }
  return made;
}
async function updateMany(table, records) {
  const done = [];
  for (const batch of chunk10(records)) {
    const j = await at(table, { method: 'PATCH', body: { records: batch } });
    done.push(...j.records);
  }
  return done;
}
async function deleteMany(table, ids) {
  for (const batch of chunk10(ids)) {
    await at(table, { method: 'DELETE', params: batch.map(id => ['records[]', id]) });
  }
}

// Trailing " · pain N" and " · RPE N" are split off for display and search.
function splitResult(text) {
  let body = String(text || ''), pain = null, rpe = null, m;
  for (;;) {
    if ((m = body.match(/\s*·\s*RPE\s*(\d+)\s*$/i)))      { rpe  = +m[1]; body = body.slice(0, m.index); continue; }
    if ((m = body.match(/\s*·\s*pain\s*(\d+)\s*$/i)))     { pain = +m[1]; body = body.slice(0, m.index); continue; }
    break;
  }
  return { body: body.trim(), pain, rpe };
}
const joinResult = (body, pain, rpe) =>
  body.trim() + (pain == null ? '' : ' · pain ' + pain) + (rpe == null ? '' : ' · RPE ' + rpe);

const isSkipped = t => /^\s*skipped\b/i.test(String(t || ''));
const isCompleted = t => String(t || '').trim() === 'Completed';

// Readiness lives as a fixed first line of the day's Day Notes.
function splitNotes(raw) {
  const lines = String(raw || '').split('\n').map(s => s.trim()).filter(Boolean);
  let readiness = null;
  if (lines.length) {
    const m = lines[0].match(/^Readiness:\s*(Green|Yellow|Red)\s*$/i);
    if (m) {
      readiness = m[1][0].toUpperCase() + m[1].slice(1).toLowerCase();
      lines.shift();
    }
  }
  return { readiness, lines };
}

// "Block A" → A, "Sled Superset" → S, "Accessory" → A.
const blockLetter = name => {
  const m = String(name).match(/^Block\s+(\S)/i);
  return (m ? m[1] : String(name).trim()[0] || '?').toUpperCase();
};

// Block colours are handed out in order of first appearance and kept in
// localStorage so a block keeps its colour between sessions.
const loadBlockColors = () => { try { return JSON.parse(localStorage.getItem(LS_COLORS)) || {}; } catch (e) { return {}; } };
let BLOCK_COLORS = loadBlockColors();

function blockColor(name) {
  if (BLOCK_COLORS[name]) return BLOCK_COLORS[name];
  const used = new Set(Object.values(BLOCK_COLORS));
  const free = AV_PALETTE.find(c => !used.has(c)) || AV_PALETTE[Object.keys(BLOCK_COLORS).length % AV_PALETTE.length];
  BLOCK_COLORS = { ...BLOCK_COLORS, [name]: free };
  try { localStorage.setItem(LS_COLORS, JSON.stringify(BLOCK_COLORS)); } catch (e) {}
  return free;
}

// Avatar comes from Block when the row has one, otherwise from Section.
function avatarFor(row) {

  const s = SECTION_AV[row.section];
  if (s) return { letter: s.letter, color: s.color, label: row.section };
  return { letter: (row.section || '?').trim()[0].toUpperCase(), color: '#5F6368', label: row.section };
}

/* ═══════════════════════ week resolution ═══════════════════════ */

// Rows whose Week Of matches the week's Monday are an overlay and replace the
// template entirely; otherwise the template rows (blank Week Of) are the week.
function weekRows(schedule, dateISO) {
  const ws = weekStartOf(dateISO);
  const overlay = schedule.filter(r => r.weekOf === ws);
  return { weekStart: ws, isOverlay: overlay.length > 0, rows: overlay.length ? overlay : schedule.filter(r => !r.weekOf) };
}

function rowsForDate(schedule, dateISO) {
  const { rows, isOverlay, weekStart } = weekRows(schedule, dateISO);
  const dow = dowName(dateISO);
  return { weekStart, isOverlay, rows: rows.filter(r => r.dow === dow).sort((a, b) => a.order - b.order) };
}

// One line per linked exercise; a row linking two exercises yields two lines.
function linesForDate(schedule, dateISO, exById) {
  const { rows, isOverlay, weekStart } = rowsForDate(schedule, dateISO);
  const lines = [];
  for (const r of rows) {
    for (const exId of r.exercises) {
      lines.push({
        key: r.id + ':' + exId,
        rowId: r.id,
        exerciseId: exId,
        name: (exById[exId] || {}).name || '(unknown exercise)',
        prescription: r.prescription,
        section: r.section,
        block: r.block,
        order: r.order,
        av: avatarFor(r),
      });
    }
  }
  return { weekStart, isOverlay, lines };
}

/* ═══════════════════════ copy-on-write materialization ═══════════════════════ */

// The first edit to a template week copies every template row for that week
// into Week Of = weekStart rows. Templates are never touched by this path.
async function materializeWeek(schedule, weekStart) {
  const already = schedule.filter(r => r.weekOf === weekStart);
  if (already.length) return { rows: already, map: null, wasNeeded: false };

  const template = schedule.filter(r => !r.weekOf);
  const made = await createMany(TBL.schedule, template.map(r => rowFields(r, weekStart)));
  const rows = made.map(shapeRow);
  // Airtable returns created records in the order sent, so a template row and
  // its copy line up by index.
  const map = Object.fromEntries(template.map((t, i) => [t.id, rows[i]]));
  return { rows, map, wasNeeded: true };
}

// Copy a week's resolved rows forward into another week's overlay.
async function copyWeekInto(schedule, fromDate, targetWeekStart) {
  const existing = schedule.filter(r => r.weekOf === targetWeekStart);
  if (existing.length) return { created: [], alreadyThere: true };
  const { rows } = weekRows(schedule, fromDate);
  const made = await createMany(TBL.schedule, rows.map(r => rowFields(r, targetWeekStart)));
  return { created: made.map(shapeRow), alreadyThere: false };
}

// Gmail row with swipe-to-remove and a drag handle.
function ExerciseRow({ line, log, last, onToggle, onOpen, onRemove, onDragStart, swipeOpen, setSwipeOpen }) {
  const sw = useRef(null);
  const el = useRef(null);
  const g = useRef(null);      // live gesture: { x0, y0, lastX, axis }
  const moved = useRef(false);

  const setX = x => { if (el.current) el.current.style.transform = x ? 'translateX(' + x + 'px)' : ''; };
  const swiping = on => { if (sw.current) sw.current.classList.toggle('swiping', on); };
  const reset = () => { setX(0); swiping(false); };

  useEffect(() => { if (swipeOpen !== line.key) reset(); }, [swipeOpen, line.key]);

  const down = e => {
    if (e.target.closest('.hdl') || e.target.closest('.av')) return;
    g.current = { x0: e.clientX, y0: e.clientY, lastX: e.clientX, axis: null };
    moved.current = false;
    if (el.current) el.current.style.transition = 'none';
  };

  const move = e => {
    const s = g.current;
    if (!s) return;
    const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
    // Decide once whether this is a scroll or a swipe, and stay decided.
    if (s.axis === null) {
      if (Math.abs(dy) > 8 && Math.abs(dy) >= Math.abs(dx)) { s.axis = 'y'; reset(); return; }
      if (dx < -12 && Math.abs(dx) > Math.abs(dy) * 1.5) { s.axis = 'x'; swiping(true); }
      else return;
    }
    if (s.axis !== 'x') return;
    s.lastX = e.clientX;
    moved.current = true;
    setX(Math.max(Math.min(0, dx), -110));
  };

  // pointercancel means the browser took the gesture over for scrolling; it
  // carries no meaningful coordinate, so it must never commit a removal.
  const finish = commit => () => {
    const s = g.current;
    g.current = null;
    if (el.current) el.current.style.transition = '';
    const close = () => { reset(); if (swipeOpen === line.key) setSwipeOpen(null); };
    if (!s || s.axis !== 'x' || !commit) return close();
    const dx = s.lastX - s.x0;
    if (dx < -170) { setX(-window.innerWidth); setTimeout(onRemove, 160); }
    else if (dx < -55) { setX(-96); setSwipeOpen(line.key); }
    else close();
  };

  const done = !!log;
  const result = log ? splitResult(log.text) : null;
  const when = done ? 'Done' : (last ? fmtShort(last.date) : '');

  // A bare "Completed" marker says nothing the green Done does not already say.
  let detail = '';
  if (done && !isCompleted(log.text)) detail = 'Today: ' + (isSkipped(log.text) ? 'Skipped' : result.body);
  else if (!done && last) detail = 'Last: ' + splitResult(last.text).body;

  const first = line.prescription || detail;
  const second = line.prescription ? detail : '';

  return (
    <div className="sw" ref={sw}>
      <div className="del" onClick={onRemove}>Remove</div>
      <div ref={el} className={'row' + (done ? ' done' : '')}
           onPointerDown={down} onPointerMove={move} onPointerUp={finish(true)} onPointerCancel={finish(false)}
           onClick={e => { if (moved.current) { e.stopPropagation(); moved.current = false; return; } onOpen(); }}>
        <div className="av" style={{ background: line.av.color }}
             onClick={e => { e.stopPropagation(); onToggle(); }}>
          <i>{line.av.letter}</i><IcCheck />
        </div>
        <div className="body">
          <div className="t">
            <div className="name">{line.name}</div>
            <div className="when">{when}</div>
          </div>
          <div className="p1">{first || ' '}</div>
          <div className="p2">
            {second}
            {done && result && result.pain != null && <span className="chipmini" data-amber={result.pain >= 3 ? 'red' : result.pain >= 2 ? 'amber' : ''}>pain {result.pain}</span>}
            {done && result && result.rpe != null && <span className="chipmini">RPE {result.rpe}</span>}
          </div>
        </div>
        {swipeOpen !== line.key && (
          <div className="hdl" onPointerDown={e => onDragStart(e, line.key)}><IcGrip /></div>
        )}
      </div>
    </div>
  );
}

const pairedWith = rx => { const m = String(rx || '').match(/paired with ([^—·\n]+)/i); return m ? 'paired with ' + m[1].trim() : ''; };

// Second quick chip: the last result with its first weight nudged up 5 lb.
function bumpWeight(text) {
  const m = String(text).match(/(\d+(?:\.\d+)?)(\s*lb)/i);
  if (!m) return null;
  const next = (parseFloat(m[1]) + 5).toString().replace(/\.0$/, '');
  return text.slice(0, m.index) + next + m[2] + text.slice(m.index + m[0].length);
}

    ])).then(rs => { if (live) setHist(rs.map(shapeLog)); })
       .catch(() => { if (live) setHist([]); });
    return () => { live = false; };
  }, [line.name]);

  const past = (hist || []).filter(l => l.date !== date);
  const lastResult = past.length ? splitResult(past[0].text).body : '';
  const chips = [];
  if (lastResult && !isCompleted(past[0].text)) {
    chips.push(lastResult);
    const up = bumpWeight(lastResult);
    if (up) chips.push(up);
  }
  chips.push('Skipped');

  const sub = [line.block || line.section, dowName(date), pairedWith(line.prescription)].filter(Boolean).join(' · ');

  const save = async () => {
    if (!text.trim() || busy) return;
    setBusy(true);
    await onSave(joinResult(text, pain, rpe));
    setBusy(false);
  };

  // Horizontal swipe moves to the neighbouring exercise.
  const g = useRef(null);
  const down = e => { g.current = { x: e.clientX, y: e.clientY }; };
  const up = e => {
    const s = g.current; g.current = null;
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) onGo(dx < 0 ? next : prev);
  };

  const shown = all ? past : past.slice(0, 5);

  return (
    <div className="pg on">
      <div className="pgtop">
        <div className="back" onClick={onClose}><IcBack /></div>
        <div className="pos">{index + 1} of {total}</div>
        <div className="pgacts"><div className="ic" onClick={() => setMenu('menu')}><IcDots /></div></div>
      </div>

      <div className="pgscroll" onPointerDown={down} onPointerUp={up}>
        <div className="pghead">
          <div className="av" style={{ background: line.av.color, margin: 0 }}><i>{line.av.letter}</i></div>
          <div>
            <div className="pgname">{line.name}</div>
            <div className="pgsub">{sub}</div>
          </div>
        </div>

        <div className="pgfield">
          <input value={text} placeholder="Log today's result…" onChange={e => setText(e.target.value)}
                 onKeyDown={e => e.key === 'Enter' && save()} />
          <div className="save" onClick={save} style={busy ? { opacity: .5 } : null}><IcTick /></div>
        </div>

        <div className="chips">
          {chips.map(c => <span key={c} onClick={() => setText(c)}>{c}</span>)}
        </div>

        <div className="pr">
          <div className="grp">
            <small>Pain</small>
            {PAIN.map(n => (
              <div key={n} className={'ch' + (pain === n ? ' on' : '') + (pain === n && n >= 2 ? ' amber' : '')}
                   onClick={() => setPain(pain === n ? null : n)}>{n}</div>
            ))}
          </div>
          <div className="grp">
            <small>RPE</small>
            {RPE.map(n => (
              <div key={n} className={'ch' + (rpe === n ? ' on' : '')} onClick={() => setRpe(rpe === n ? null : n)}>{n}</div>
            ))}
          </div>
        </div>

        {line.prescription && (
          <div className="sec">
            <div className="lab">Prescription</div>
            <p>{line.prescription}</p>
          </div>
        )}

        {exercise && exercise.notes && (
          <div className="sec">
            <div className="lab">Coaching notes</div>
            {exercise.notes.split('\n').map(s => s.trim()).filter(Boolean).map((t, i) => <p key={i}>{t}</p>)}
          </div>
        )}

        <div className="sec">
          <div className="lab">History</div>
          {hist === null && <p className="rule">Loading…</p>}
          {hist && past.length === 0 && <p className="rule">No results yet.</p>}
          {shown.map(l => {
            const r = splitResult(l.text);
            return (
              <div className="h" key={l.id}>
                <span>{fmtShort(l.date)}</span>
                <span>
                  {r.body}
                  {r.pain != null && <span className="chipmini" data-amber={r.pain >= 3 ? 'red' : r.pain >= 2 ? 'amber' : ''}>pain {r.pain}</span>}
                  {r.rpe != null && <span className="chipmini">RPE {r.rpe}</span>}
                </span>
              </div>
            );
          })}
          {hist && !all && past.length > 5 && <div className="more" onClick={() => setAll(true)}>Show all {past.length}</div>}
        </div>
      </div>

      <div className="pgnav">
        <div className="nb" onClick={() => prev && onGo(prev)} style={prev ? null : { opacity: .35 }}>
          <IcBack />
          <div><small>Previous</small><b>{prev ? prev.name : '—'}</b></div>
        </div>
        <div className="nb r" onClick={() => next && onGo(next)} style={next ? null : { opacity: .35 }}>
          <div><small>Next</small><b>{next ? next.name : '—'}</b></div>
          <IcNext />
        </div>
      </div>

      {menu === 'menu' && (
        <Sheet onClose={() => setMenu(null)}>
          <div className="shead">{line.name}</div>
          <div className="opt" onClick={() => { setMenu(null); onSkip(); }}>
            <div className="ob"><b>Skip today</b><small>Logs “Skipped” for {fmtShort(date)}</small></div>
          </div>
          <div className="opt" onClick={() => setMenu('move')}>
            <div className="ob"><b>Move to another day</b><small>This week only</small></div>
          </div>
          <div className="opt" onClick={() => { setMenu(null); onRemove(); }}>
            <div className="ob"><b style={{ color: 'var(--red)' }}>Remove from this week</b><small>The template is left alone</small></div>
          </div>
          <div className="opt" onClick={() => { setMenu(null); onLibrary(); }}>
            <div className="ob"><b>Open in Exercises</b><small>Library entry and full history</small></div>
          </div>
        </Sheet>
      )}

      {menu === 'move' && (
        <Sheet onClose={() => setMenu(null)}>
          <div className="shead">Move {line.name} to…</div>
          {weekDays(date).map(d => (
            <div className="opt" key={d} onClick={() => { setMenu(null); onMove(d); }}>
              <div className="av" style={{ background: dayAvatar(dowName(d)).color }}><i>{dayAvatar(dowName(d)).letter}</i></div>
              <div className="ob">
                <b>{dowName(d)}</b>
                <small>{fmtShort(d)}{d === date ? ' · current day' : ''}</small>
              </div>
            </div>
          ))}
        </Sheet>
      )}
    </div>
  );
}

/* ═══════════════════════ app ═══════════════════════ */

function Setup({ onDone }) {
  const [v, setV] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    const token = v.trim();
    if (!token) return;
    setBusy(true); setErr('');
    setPat(token);
    try { await at(TBL.exercises, { params: [['maxRecords', 1]] }); onDone(); }
    catch (e) {
      setPat('');
      setErr(e instanceof AuthError ? 'That token was rejected. Check its scopes and base access.' : String(e.message || e));
      setBusy(false);
    }
  };
  return (
    <div className="setup">
      <h1>Ledger</h1>
      <p>Paste an Airtable personal access token with <code>data.records:read</code> and <code>data.records:write</code> on the Training base. It is stored on this device only.</p>
      <input type="password" value={v} placeholder="pat…" autoCapitalize="off" autoCorrect="off" spellCheck="false"
             onChange={e => setV(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />
      <button onClick={submit} disabled={busy}>{busy ? 'Checking…' : 'Connect'}</button>
      {err && <div className="err">{err}</div>}
    </div>
  );
}

function App() {
  const [ready, setReady]   = useState(!!PAT);
  const [data, setData]     = useState(null);
  const [error, setError]   = useState('');
  const [selected, setSel]  = useState(todayISO());
  const [days, setDays]     = useState({});      // iso -> { logs, note, loaded, noteLoaded }
  const [lastBy, setLastBy] = useState({});      // exerciseId -> last log before the selected date, or null
  const [toast, setToast]   = useState(null);
  const [hidden, setHidden] = useState({});      // line key -> true while a removal is in flight
  const [orderOf, setOrder] = useState({});      // date -> [line key] while a reorder is in flight
  const [swipeOpen, setSwipeOpen] = useState(null);
  const [openKey, setOpenKey] = useState(null);   // exercise page
  const [theme, setTheme]   = useState(document.documentElement.dataset.theme);

  const today = todayISO();
  const daysRef = useRef(days);       daysRef.current = days;
  const schedRef = useRef([]);        schedRef.current = data ? data.schedule : [];
  const toastTimer = useRef(null);

  /* ---- toasts ---- */
  const showToast = useCallback((text, opts = {}) => {
    clearTimeout(toastTimer.current);
    setToast({ text, ...opts });
    toastTimer.current = setTimeout(() => setToast(null), opts.ms || 5000);
  }, []);
  const hideToast = useCallback(() => { clearTimeout(toastTimer.current); setToast(null); }, []);

  /* ---- reference tables ---- */
  const loadCore = useCallback(async () => {
    const [ex, sch, races] = await Promise.all([atAll(TBL.exercises), atAll(TBL.schedule), atAll(TBL.races)]);
    const exercises = ex.map(shapeExercise);
    setData({
      exercises,
      exById: Object.fromEntries(exercises.map(e => [e.id, e])),
      schedule: sch.map(shapeRow),
      races: races.map(shapeRace),
      fetchedAt: Date.now(),
    });
  }, []);

  useEffect(() => {
    if (!ready) return;
    let live = true;
    loadCore().catch(e => {
      if (!live) return;
      if (e instanceof AuthError) { setReady(false); setError(''); }
      else setError(String(e.message || e));
    });
    return () => { live = false; };
  }, [ready, loadCore]);

  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState !== 'visible' || !data) return;
      if (Date.now() - data.fetchedAt > STALE_MS) loadCore().catch(() => {});
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [data, loadCore]);

  /* ---- per-date logs and note ---- */
  const patchDay = useCallback((date, fn) => {
    setDays(prev => {
      const cur = prev[date] || { logs: [], note: null, loaded: false, noteLoaded: false };
      return { ...prev, [date]: { ...cur, ...fn(cur) } };
    });
  }, []);

  const loadDay = useCallback(async (d, withNote) => {
    const [logs, notes] = await Promise.all([
      limit(() => atAll(TBL.logs, [['filterByFormula', '{Log Date} = "' + d + '"']])),
      withNote ? limit(() => atAll(TBL.dayNotes, [['filterByFormula', '{Date} = "' + d + '"']])) : Promise.resolve(null),
    ]);
    patchDay(d, cur => ({
      logs: logs.map(shapeLog),
      loaded: true,
      note: notes ? (notes[0] ? shapeNote(notes[0]) : null) : cur.note,
      noteLoaded: notes ? true : cur.noteLoaded,
    }));
  }, [patchDay]);

  useEffect(() => {
    if (!data) return;
    const d = days[selected];
    if (!d || !d.loaded || !d.noteLoaded) loadDay(selected, true).catch(() => {});
    weekDays(selected).forEach(x => {
      if (x !== selected && !(days[x] && days[x].loaded)) loadDay(x, false).catch(() => {});
    });
  }, [data, selected]);  // eslint-disable-line

  /* ---- resolved lines for the day ---- */
  const resolved = useMemo(() => {
    if (!data) return { lines: [], isOverlay: false, weekStart: weekStartOf(selected) };
    return linesForDate(data.schedule, selected, data.exById);
  }, [data, selected]);

  const lines = useMemo(() => {
    let ls = resolved.lines.filter(l => !hidden[l.key]);
    const ord = orderOf[selected];
    if (ord) {
      const pos = Object.fromEntries(ord.map((k, i) => [k, i]));
      ls = [...ls].sort((a, b) => (pos[a.key] ?? 1e9) - (pos[b.key] ?? 1e9));
    }
    return ls;
  }, [resolved, hidden, orderOf, selected]);

  const dayState = days[selected];
  const logsByEx = useMemo(() => {
    const m = {};
    (dayState ? dayState.logs : []).forEach(l => { if (l.exerciseId) m[l.exerciseId] = l; });
    return m;
  }, [dayState]);

  const dots = useMemo(() => {
    const s = new Set();
    weekDays(selected).forEach(d => { if (days[d] && days[d].logs.length) s.add(d); });
    return s;
  }, [days, selected]);

  const noteState = useMemo(() => splitNotes(dayState && dayState.note ? dayState.note.notes : ''), [dayState]);

  const nextRace = useMemo(() => {
    if (!data) return null;
    const r = data.races.filter(x => x.date && x.date >= today && x.status !== 'Completed')
                        .sort((a, b) => a.date.localeCompare(b.date))[0];
    return r ? { name: r.name, days: daysUntil(r.date) } : null;
  }, [data, today]);

  /* ---- last result per visible exercise ---- */
  useEffect(() => {
    if (!data) return;
    lines.forEach(l => {
      const key = l.exerciseId + '|' + selected;
      if (lastBy[key] !== undefined) return;
      setLastBy(m => ({ ...m, [key]: null }));
      limit(() => atAll(TBL.logs, [
        ['filterByFormula', 'AND({Exercise} = "' + esc(l.name) + '", {Log Date} < "' + selected + '")'],
        ['sort[0][field]', 'Log Date'], ['sort[0][direction]', 'desc'], ['maxRecords', 1],
      ])).then(rs => setLastBy(m => ({ ...m, [key]: rs[0] ? shapeLog(rs[0]) : null })))
         .catch(() => {});
    });
  }, [data, lines, selected]);  // eslint-disable-line

  /* ---- copy-on-write ---- */
  // Returns a map from template row id to its copy, or null when the week is
  // already an overlay.
  const ensureOverlay = useCallback(async date => {
    const ws = weekStartOf(date);
    if (schedRef.current.some(r => r.weekOf === ws)) return null;
    const { rows, map } = await materializeWeek(schedRef.current, ws);
    setData(d => ({ ...d, schedule: d.schedule.concat(rows) }));
    schedRef.current = schedRef.current.concat(rows);
    return map;
  }, []);

  /* ---- toggle done ---- */
  const toggleLine = async line => {
    const existing = logsByEx[line.exerciseId];
    if (existing && !isCompleted(existing.text)) {
      if (!window.confirm('Remove the logged result for ' + line.name + '?\n\n' + existing.text)) return;
    }
    const date = selected;
    const snapshot = (daysRef.current[date] || { logs: [] }).logs;
    if (existing) {
      patchDay(date, d => ({ logs: d.logs.filter(l => l.exerciseId !== line.exerciseId) }));
      try { await deleteLog(existing.id); }
      catch (e) { patchDay(date, () => ({ logs: snapshot })); showToast('Could not remove that result.', { kind: 'error' }); }
    } else {
      const tmp = 'tmp:' + Math.random().toString(36).slice(2);
      patchDay(date, d => ({ logs: d.logs.concat([{ id: tmp, exerciseId: line.exerciseId, date, text: 'Completed' }]) }));
      try {
        const res = await createLog(line.exerciseId, date, 'Completed');
        const id = res.records[0].id;
        patchDay(date, d => ({ logs: d.logs.map(l => (l.id === tmp ? { ...l, id } : l)) }));
      } catch (e) { patchDay(date, () => ({ logs: snapshot })); showToast('Could not save that.', { kind: 'error' }); }
    }
  };

  /* ---- write a result for one line ---- */
  const writeResult = useCallback(async (line, date, text) => {
    const snapshot = (daysRef.current[date] || { logs: [] }).logs;
    const existing = snapshot.find(l => l.exerciseId === line.exerciseId);
    if (existing) {
      patchDay(date, d => ({ logs: d.logs.map(l => (l.exerciseId === line.exerciseId ? { ...l, text } : l)) }));
      try { await updateLog(existing.id, text); }
      catch (e) { patchDay(date, () => ({ logs: snapshot })); showToast('Could not save that result.', { kind: 'error' }); return false; }
    } else {
      const tmp = 'tmp:' + Math.random().toString(36).slice(2);
      patchDay(date, d => ({ logs: d.logs.concat([{ id: tmp, exerciseId: line.exerciseId, date, text }]) }));
      try {
        const res = await createLog(line.exerciseId, date, text);
        const id = res.records[0].id;
        patchDay(date, d => ({ logs: d.logs.map(l => (l.id === tmp ? { ...l, id } : l)) }));
      } catch (e) { patchDay(date, () => ({ logs: snapshot })); showToast('Could not save that result.', { kind: 'error' }); return false; }
    }
    return true;
  }, [patchDay, showToast]);

  /* ---- move a line to another day of the same week ---- */
  const moveLine = async (line, toDate) => {
    const date = selected;
    if (toDate === date) return;
    try {
      const map = await ensureOverlay(date);
      const rowId = map && map[line.rowId] ? map[line.rowId].id : line.rowId;
      const row = schedRef.current.find(r => r.id === rowId);
      if (!row) throw new Error('row not found');

      const toDow = dowName(toDate);
      const onTarget = schedRef.current.filter(r => r.weekOf === weekStartOf(date) && r.dow === toDow);
      const order = (onTarget.length ? Math.max(...onTarget.map(r => r.order)) : 0) + 10;

      if (row.exercises.length > 1) {
        // Take only this exercise across; the row's siblings stay put.
        const rest = row.exercises.filter(id => id !== line.exerciseId);
        await setRowExercises(rowId, rest);
        const made = await createMany(TBL.schedule, [{ ...rowFields(row), 'Day of Week': toDow, 'Order': order, 'Exercise': [line.exerciseId] }]);
        const fresh = made.map(shapeRow);
        setData(d => ({ ...d, schedule: d.schedule.map(r => (r.id === rowId ? { ...r, exercises: rest } : r)).concat(fresh) }));
      } else {
        await updateMany(TBL.schedule, [{ id: rowId, fields: { 'Day of Week': toDow, 'Order': order } }]);
        setData(d => ({ ...d, schedule: d.schedule.map(r => (r.id === rowId ? { ...r, dow: toDow, order } : r)) }));
      }
      setOpenKey(null);
      showToast('Moved ' + line.name + ' to ' + toDow + '.');
    } catch (e) {
      if (e instanceof AuthError) { setReady(false); return; }
      showToast('Could not move ' + line.name + '.', { kind: 'error' });
    }
  };

  /* ---- remove a line, with Undo ---- */
  // The write lands straight away; Undo puts the row back rather than holding
  // the delete, so closing the app mid-toast cannot lose the edit.
  const removeLine = async line => {
    setSwipeOpen(null);
    setHidden(h => ({ ...h, [line.key]: true }));
    const date = selected;

    try {
      const map = await ensureOverlay(date);
      const materialized = !!map;
      const rowId = map && map[line.rowId] ? map[line.rowId].id : line.rowId;
      const row = schedRef.current.find(r => r.id === rowId);
      if (!row) throw new Error('row not found');

      let undo;
      if (row.exercises.length > 1) {
        // The row links several exercises; drop just this one rather than
        // taking its siblings with it.
        const before = row.exercises;
        const next = before.filter(id => id !== line.exerciseId);
        await setRowExercises(rowId, next);
        setData(d => ({ ...d, schedule: d.schedule.map(r => (r.id === rowId ? { ...r, exercises: next } : r)) }));
        undo = async () => {
          await setRowExercises(rowId, before);
          setData(d => ({ ...d, schedule: d.schedule.map(r => (r.id === rowId ? { ...r, exercises: before } : r)) }));
        };
      } else {
        const fields = rowFields(row);
        await deleteMany(TBL.schedule, [rowId]);
        setData(d => ({ ...d, schedule: d.schedule.filter(r => r.id !== rowId) }));
        undo = async () => {
          const made = await createMany(TBL.schedule, [fields]);
          const back = made.map(shapeRow);
          setData(d => ({ ...d, schedule: d.schedule.concat(back) }));
          // The row comes back under a new id, so the old line key is stale.
          setHidden(h => { const n = { ...h }; delete n[line.key]; return n; });
        };
      }

      setHidden(h => { const n = { ...h }; delete n[line.key]; return n; });
      showToast((materialized ? 'Customizing week of ' + fmtShort(weekStartOf(date)) + ' · removed ' : 'Removed ') + line.name, {
        action: 'Undo',
        onAction: () => {
          hideToast();
          undo().catch(() => showToast('Could not undo that.', { kind: 'error' }));
        },
      });
    } catch (e) {
      if (e instanceof AuthError) { setReady(false); return; }
      setHidden(h => { const n = { ...h }; delete n[line.key]; return n; });
      showToast('Could not remove ' + line.name + '.', {
        kind: 'error', action: 'Retry', onAction: () => { hideToast(); removeLine(line); },
      });
    }
  };

  /* ---- drag reorder ---- */
  const listRef = useRef(null);
  const drag = useRef(null);

  const onDragStart = (e, key) => {
    e.preventDefault(); e.stopPropagation();
    const nodes = [...listRef.current.querySelectorAll('.sw')];
    const keys = lines.map(l => l.key);
    const from = keys.indexOf(key);
    if (from < 0) return;
    const el = nodes[from];
    el.classList.add('lift');
    drag.current = { key, from, to: from, nodes, keys, el };

    const move = ev => {
      const d = drag.current; if (!d) return;
      d.nodes.forEach(n => n.classList.remove('gap-top', 'gap-bot'));
      let to = d.nodes.length - 1;
      for (let i = 0; i < d.nodes.length; i++) {
        const b = d.nodes[i].getBoundingClientRect();
        if (ev.clientY < b.top + b.height / 2) { to = i; break; }
      }
      d.to = to;
      const target = d.nodes[to];
      if (target && target !== d.el) target.classList.add(to > d.from ? 'gap-bot' : 'gap-top');
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const d = drag.current; drag.current = null;
      if (!d) return;
      d.nodes.forEach(n => n.classList.remove('gap-top', 'gap-bot', 'lift'));
      if (d.to !== d.from) commitReorder(d.keys, d.from, d.to);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  const commitReorder = async (keys, from, to) => {
    const next = [...keys];
    next.splice(to, 0, next.splice(from, 1)[0]);
    const date = selected;
    setOrder(o => ({ ...o, [date]: next }));

    try {
      const map = await ensureOverlay(date);
      // One line per exercise, so several lines can share a row; the row takes
      // the position of its first line.
      const byKey = Object.fromEntries(resolved.lines.map(l => [l.key, l]));
      const seen = new Set(); const rowOrder = [];
      next.forEach(k => {
        const l = byKey[k]; if (!l) return;
        const rowId = map && map[l.rowId] ? map[l.rowId].id : l.rowId;
        if (!seen.has(rowId)) { seen.add(rowId); rowOrder.push(rowId); }
      });
      const records = rowOrder.map((id, i) => ({ id, fields: { 'Order': (i + 1) * 10 } }));
      await updateMany(TBL.schedule, records);
      const orderById = Object.fromEntries(records.map(r => [r.id, r.fields['Order']]));
      setData(d => ({ ...d, schedule: d.schedule.map(r => (orderById[r.id] != null ? { ...r, order: orderById[r.id] } : r)) }));
      setOrder(o => { const n = { ...o }; delete n[date]; return n; });
    } catch (e) {
      if (e instanceof AuthError) { setReady(false); return; }
      setOrder(o => { const n = { ...o }; delete n[date]; return n; });
      showToast('Could not save the new order.', { kind: 'error' });
    }
  };

  /* ---- week swipe ---- */
  const touch = useRef(null);
  const onTouchStart = e => { touch.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = e => {
    const s = touch.current; touch.current = null;
    if (!s) return;
    const dx = e.changedTouches[0].clientX - s.x;
    const dy = e.changedTouches[0].clientY - s.y;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45) { setSel(addDays(selected, dx < 0 ? 7 : -7)); setSwipeOpen(null); }
  };

  const toggleTheme = () => {
    const t = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    localStorage.setItem(LS_THEME, t);
    setTheme(t);
  };

  if (!ready) return <div className="phone"><Setup onDone={() => { setError(''); setReady(true); }} /></div>;
  if (error) return <div className="phone"><div className="boot"><span style={{ color: 'var(--red)' }}>{error}</span></div></div>;
  if (!data) return <div className="phone"><div className="boot">Loading…</div></div>;

  return (
    <div className="phone">
      <DayBar days={weekDays(selected)} selected={selected} today={today} dots={dots}
              onPick={d => { setSel(d); setSwipeOpen(null); }}
              onHome={() => { setSel(today); setSwipeOpen(null); }} />

      <div className="ctx">
        <div className="date">{fmtFull(selected)}</div>
        {nextRace && (
          <div className="race">
            <span className="rn">{nextRace.name}</span>
            <span className="rd">· {nextRace.days}d</span>
          </div>
        )}
      </div>

      <div className="scroll" id="list" ref={listRef} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <NotesRow date={selected} readiness={noteState.readiness} lines={noteState.lines}
                  onOpen={() => showToast('The Notes page arrives in step 4.', { ms: 2000 })} />

        {lines.map(l => (
          <ExerciseRow key={l.key} line={l}
                       log={logsByEx[l.exerciseId]}
                       last={lastBy[l.exerciseId + '|' + selected]}
                       onToggle={() => toggleLine(l)}
                       onOpen={() => setOpenKey(l.key)}
                       onRemove={() => removeLine(l)}
                       onDragStart={onDragStart}
                       swipeOpen={swipeOpen} setSwipeOpen={setSwipeOpen} />
        ))}

        {lines.length === 0 && (
          <div style={{ padding: '28px 16px', color: 'var(--faint)', textAlign: 'center' }}>
            Nothing scheduled for {dowName(selected)}.
          </div>
        )}
      </div>

      {(() => {
        if (!openKey) return null;
        const i = lines.findIndex(l => l.key === openKey);
        if (i < 0) return null;
        const line = lines[i];
        return (
          <ExercisePage
            line={line} index={i} total={lines.length} date={selected}
            exercise={data.exById[line.exerciseId]}
            log={logsByEx[line.exerciseId]}
            prev={lines[i - 1] || null} next={lines[i + 1] || null}
            onClose={() => setOpenKey(null)}
            onGo={l => l && setOpenKey(l.key)}
            onSave={async text => {
              const ok = await writeResult(line, selected, text);
              if (!ok) return;
              // Saving checks the row and moves on; the last one returns to the list.
              setOpenKey(lines[i + 1] ? lines[i + 1].key : null);
            }}
            onSkip={async () => {
              await writeResult(line, selected, 'Skipped');
              setOpenKey(lines[i + 1] ? lines[i + 1].key : null);
            }}
            onRemove={() => { setOpenKey(null); removeLine(line); }}
            onMove={d => moveLine(line, d)}
            onLibrary={() => showToast('The Exercises library arrives in step 4.', { ms: 2000 })}
          />
        );
      })()}

      <Toast toast={toast} onAction={() => { if (toast && toast.onAction) toast.onAction(); }} />
      <BottomBar raceDays={nextRace ? nextRace.days : null} onTheme={toggleTheme}
                 inert={() => showToast('That screen arrives in step 4.', { ms: 2000 })} />
    </div>
  );
}

const savedTheme = localStorage.getItem(LS_THEME);
document.documentElement.dataset.theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
